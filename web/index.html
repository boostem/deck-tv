<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Deck TV</title>
<style>
  :root {
    color-scheme: dark;
    --plastic-hi: #2d2e33;
    --plastic: #1c1d20;
    --plastic-lo: #121215;
    --silk: #8e9098;                 /* silkscreened labels on the cabinet */
    --osd: #62ff80;                  /* green on-screen display, old-TV style */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh;
    /* A dark living room: faint glow on the wall, a floor line under the set. */
    background:
      radial-gradient(ellipse 70% 55% at 50% 40%, #202025 0%, transparent 70%),
      linear-gradient(#141417 0%, #0f0f12 80%, #09090a 80%, #060607 100%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }

  /* ---- the set: fits the viewport; everything inside is sized off its width --- */
  #set {
    width: min(98vw, calc(97dvh / 0.965));
    container-type: inline-size;
    display: flex; flex-direction: column;
  }
  .cabinet {
    padding: 3.2cqw 3.6cqw 0;
    border-radius: 2.4cqw 2.4cqw 1cqw 1cqw;
    background: linear-gradient(180deg, var(--plastic-hi) 0%, var(--plastic) 10%, var(--plastic-lo) 100%);
    box-shadow:
      inset 0 0.25cqw 0 rgba(255, 255, 255, .08),
      inset 0.25cqw 0 0 rgba(255, 255, 255, .03),
      inset -0.25cqw 0 0 rgba(0, 0, 0, .35),
      0 3cqw 6cqw rgba(0, 0, 0, .65);
  }
  .bezel {
    padding: 1.3cqw;
    border-radius: 1.8cqw;
    background: linear-gradient(145deg, #0c0c0e 0%, #232428 55%, #0a0a0b 100%);
    box-shadow: inset 0 0 0 0.15cqw rgba(255, 255, 255, .05), inset 0 0.6cqw 1.4cqw rgba(0, 0, 0, .85);
  }

  /* ---- the screen ------------------------------------------------------------ */
  #stage {
    position: relative;
    aspect-ratio: 4 / 3;
    background: #000;
    border-radius: 0.9cqw;
    overflow: hidden;
    touch-action: manipulation;           /* no double-tap zoom; taps fire immediately */
    cursor: pointer;
  }
  #stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
  #stage:-webkit-full-screen { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; }
  #video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: contain; background: #000;
  }
  /* TV static while the channel changes; drawn small and scaled up. */
  #static {
    position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%;
    image-rendering: pixelated; pointer-events: none; background: #000;
  }
  #static[hidden] { display: none; }
  .osd {
    position: absolute; z-index: 3; pointer-events: none;
    font: 700 max(12px, 2.7cqw)/1 "Courier New", ui-monospace, monospace;
    letter-spacing: .1em; color: var(--osd);
    text-shadow: 0 0 0.7cqw rgba(98, 255, 128, .75), 0.18cqw 0.18cqw 0 rgba(0, 0, 0, .85);
  }
  #osd-status { top: 5%; left: 5%; transition: opacity .8s; }
  #osd-status.fade { opacity: 0; }
  #osd-mute { bottom: 6%; left: 5%; }
  #osd-vol { bottom: 6%; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 1.2cqw; }
  #osd-vol[hidden] { display: none; }
  #osd-vol .bars { display: flex; gap: 0.45cqw; }
  #osd-vol .bars i {
    width: 1.3cqw; height: 2.4cqw; border: 0.2cqw solid var(--osd);
    box-shadow: 0 0 0.6cqw rgba(98, 255, 128, .6);
  }
  #osd-vol .bars i.on { background: var(--osd); }
  #osd-mute[hidden] { display: none; }
  /* Glass: a soft glare and darker corners, over everything on the screen. */
  #stage::after {
    content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
    border-radius: inherit;
    background:
      repeating-linear-gradient(rgba(0, 0, 0, .06) 0 1px, transparent 1px 3px),
      linear-gradient(128deg, rgba(255, 255, 255, .05) 0%, rgba(255, 255, 255, 0) 38%);
    box-shadow: inset 0 0 5cqw rgba(0, 0, 0, .55);
  }
  #overlay {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45);
  }
  #overlay[hidden] { display: none; }
  #overlay span {
    font: 700 max(14px, 2.8cqw)/1 "Courier New", ui-monospace, monospace;
    letter-spacing: .1em; color: var(--osd);
    text-shadow: 0 0 0.7cqw rgba(98, 255, 128, .75);
  }

  /* ---- front panel: grilles, badge, controls ----------------------------------- */
  .panel {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 2.4cqw;
    min-height: max(13cqw, 58px);
    padding: 1.4cqw 0.6cqw;
    box-sizing: border-box;
  }
  .grille {
    height: 100%; min-height: 6cqw; border-radius: 0.8cqw;
    background:
      radial-gradient(circle, #050506 36%, transparent 42%) 0 0 / 0.95cqw 0.95cqw,
      linear-gradient(#25262a, #17181b);
    box-shadow: inset 0 0.25cqw 0.5cqw rgba(0, 0, 0, .75), 0 0.12cqw 0 rgba(255, 255, 255, .05);
  }
  .brand { text-align: center; line-height: 1; }
  .brand b {
    display: block;
    font: 700 max(12px, 2.1cqw)/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .32em; color: #3b3c42;
    text-shadow: 0 0.12cqw 0 rgba(255, 255, 255, .06), 0 -0.1cqw 0 rgba(0, 0, 0, .6);
  }
  .brand small {
    display: block; margin-top: 0.9cqw;
    font: 600 max(6px, 0.9cqw)/1 system-ui, sans-serif; letter-spacing: .34em; color: #34353a;
  }
  .controls {
    height: 100%;
    display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 1.8cqw;
  }
  .controls .grille { grid-row: 1; }
  .control { display: flex; flex-direction: column; align-items: center; gap: 0.7cqw; }
  .label {
    font: 700 max(7px, 1.05cqw)/1 system-ui, sans-serif; letter-spacing: .22em; color: var(--silk);
  }
  .led {
    display: inline-block; width: max(6px, 0.95cqw); height: max(6px, 0.95cqw); border-radius: 50%;
    background: #2b1212; box-shadow: inset 0 0.1cqw 0.25cqw rgba(0, 0, 0, .7);
  }
  .led.red { background: #ff3b30; box-shadow: 0 0 max(4px, 0.9cqw) #ff3b30; }
  .led.green { background: #39ff6b; box-shadow: 0 0 max(4px, 0.9cqw) #39ff6b; }
  .led.amber { background: #ffb020; box-shadow: 0 0 max(4px, 0.9cqw) #ffb020; }
  .led.blink { animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: max(5px, 0.9cqw);
    min-height: 34px; box-sizing: border-box;
    padding: max(7px, 1.1cqw) max(12px, 2.2cqw);
    font: 800 max(11px, 1.5cqw)/1 system-ui, sans-serif; letter-spacing: .16em; color: #dcdde0;
    background: linear-gradient(#3b3c42, #28292d 55%, #1e1f22);
    border: max(1px, 0.12cqw) solid #09090a; border-radius: max(5px, 0.7cqw);
    box-shadow: inset 0 max(1px, 0.15cqw) 0 rgba(255, 255, 255, .15), 0 max(3px, 0.4cqw) 0 #08080a,
                0 max(4px, 0.6cqw) max(6px, 1cqw) rgba(0, 0, 0, .55);
    cursor: pointer; touch-action: manipulation;
    transition: transform .05s, box-shadow .05s;
  }
  .btn:active {
    transform: translateY(max(2px, 0.3cqw));
    box-shadow: inset 0 max(1px, 0.15cqw) 0 rgba(255, 255, 255, .08), 0 max(1px, 0.1cqw) 0 #08080a;
  }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--osd); outline-offset: 3px; }

  /* ---- the base, with the channel-surf button ----------------------------------- */
  .base {
    margin: 0 3cqw;
    min-height: max(10cqw, 56px);
    display: flex; align-items: center; justify-content: center; gap: 4cqw;
    padding: 1.2cqw 0 1.6cqw; box-sizing: border-box;
    border-radius: 0 0 1.6cqw 1.6cqw;
    background: linear-gradient(#0e0e10, #151518 30%, #0b0b0d);
    box-shadow: inset 0 0.5cqw 0.8cqw rgba(0, 0, 0, .7), 0 2cqw 3cqw rgba(0, 0, 0, .6);
  }
  .vents {
    width: 18cqw; height: max(14px, 3.2cqw); border-radius: 0.4cqw;
    background: repeating-linear-gradient(#050506 0 max(2px, 0.35cqw), transparent max(2px, 0.35cqw) max(4px, 0.8cqw));
    opacity: .9;
  }
  #surf { padding-left: max(18px, 3.4cqw); padding-right: max(18px, 3.4cqw); }
  #surf .arrows { font-size: .75em; letter-spacing: 0; opacity: .75; }
  .led.purple { background: #b98cff; box-shadow: 0 0 max(4px, 0.9cqw) #b98cff; }  /* purple means bump */

  @container (max-width: 520px) {
    .brand small { display: none; }
    .controls { grid-template-columns: auto auto; }
    .controls .grille { display: none; }
    .vents { width: 12cqw; }
  }
</style>
</head>
<body>
<div id="set">
  <div class="cabinet">
    <div class="bezel">
      <div id="stage">
        <video id="video" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="static" width="160" height="120" hidden></canvas>
        <div id="osd-status" class="osd">TUNING…</div>
        <div id="osd-mute" class="osd" hidden>MUTE</div>
        <div id="osd-vol" class="osd" hidden>VOLUME <span class="bars"></span></div>
        <div id="overlay" hidden><span>▶ TAP TO TUNE IN</span></div>
      </div>
    </div>
    <div class="panel">
      <div class="grille"></div>
      <div class="brand"><b>DECK TV</b><small>PROJECTION TELEVISION</small></div>
      <div class="controls">
        <div class="grille"></div>
        <div class="control"><span class="label">POWER</span><i id="power-led" class="led"></i></div>
        <div class="control">
          <span class="label">VOLUME</span>
          <div style="display:flex; gap:max(4px, 0.6cqw)">
            <button id="vol-down" class="btn" type="button" title="Volume down (↓)">−</button>
            <button id="vol-up" class="btn" type="button" title="Volume up (↑)">+</button>
          </div>
        </div>
        <div class="control">
          <span class="label">SOUND</span>
          <button id="mute" class="btn" type="button" aria-pressed="true" title="Mute (M)">
            <i id="mute-led" class="led red blink"></i>MUTE
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="base">
    <div class="vents"></div>
    <div class="control">
      <span class="label">CHANNEL</span>
      <button id="surf" class="btn" type="button" title="Channel surf (S)">
        <span class="arrows">▲</span>SURF<span class="arrows">▼</span>
      </button>
    </div>
    <div class="control">
      <span class="label">MODE</span>
      <button id="bumps-only" class="btn" type="button" aria-pressed="false" title="Bumps only (B)">
        <i id="bumps-led" class="led"></i>BUMPS ONLY
      </button>
    </div>
    <div class="vents"></div>
  </div>
</div>
<script src="hls.min.js"></script>
<script>
(() => {
  'use strict';

  const STREAM = 'live.m3u8';
  const HLS_CONFIG = { liveSyncDuration: 6, liveMaxLatencyDuration: 16, backBufferLength: 30 };
  const LIVE_SLACK = 14;        // seconds behind the live edge before jumping back
  const STALL_MS = 10000;       // no progress this long while "playing" → rebuild
  const LONG_AWAY_MS = 30000;   // hidden/paused longer than this → fresh reload at live
  const OSD_MS = 4000;          // how long the LIVE / TUNING readout stays up

  const stage = document.getElementById('stage');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const osdStatus = document.getElementById('osd-status');
  const osdMute = document.getElementById('osd-mute');
  const powerLed = document.getElementById('power-led');
  const muteBtn = document.getElementById('mute');
  const muteLed = document.getElementById('mute-led');

  let hls = null;
  let rebuildTimer = 0;
  let netErrors = 0;
  let lastMediaError = 0;
  let pausedAt = 0;
  let hiddenAt = 0;
  let suppressPauseUntil = 0;
  let live = false;
  let lastTime = -1;
  let lastProgress = Date.now();
  let tapTimer = 0;
  let osdTimer = 0;

  const nativeOK = () => !!video.canPlayType('application/vnd.apple.mpegurl');
  const hlsjsOK = () => typeof Hls !== 'undefined' && Hls.isSupported();

  // The set's lights and the on-screen display, like an old TV: a green
  // LIVE / TUNING readout that fades out, and MUTE that stays up while muted.
  function render(flash) {
    osdStatus.textContent = live ? 'LIVE' : 'TUNING…';
    if (flash || !live) {
      osdStatus.classList.remove('fade');
      clearTimeout(osdTimer);
      if (live) osdTimer = setTimeout(() => osdStatus.classList.add('fade'), OSD_MS);
    }
    powerLed.className = live ? 'led green' : 'led amber blink';
    osdMute.hidden = !video.muted || !osdVol.hidden;
    muteLed.className = video.muted ? 'led red blink' : 'led';
    muteBtn.setAttribute('aria-pressed', String(video.muted));
  }

  function setLive(on) {
    if (on === live) return;
    live = on;
    render(true);
  }

  // play(), falling back to muted play if autoplay with sound is refused (no
  // user gesture yet, iOS Low Power Mode, etc). Only if even muted playback is
  // refused does the screen ask for a tap.
  function safePlay() {
    video.play().catch(err => {
      if (err.name !== 'NotAllowedError') return;
      if (!video.muted) {
        video.muted = true;
        render();
        video.play().catch(() => { overlay.hidden = false; });
      } else {
        overlay.hidden = false;
      }
    });
  }

  // ---- player lifecycle ------------------------------------------------------

  function start() {
    netErrors = 0;
    lastTime = -1;
    lastProgress = Date.now();
    if ('ManagedMediaSource' in window && nativeOK()) startNative();  // Safari: keeps AirPlay
    else if (hlsjsOK()) startHlsJs();
    else if (nativeOK()) startNative();                                // older iOS
    else unsupported();
  }

  function teardown() {
    if (hls) { hls.destroy(); hls = null; }
    suppressPauseUntil = Date.now() + 2000;
    pausedAt = 0;
    video.removeAttribute('src');
    video.load();
    setLive(false);
  }

  function rebuild(delay) {
    clearTimeout(rebuildTimer);
    setLive(false);
    rebuildTimer = setTimeout(() => {
      rebuildTimer = 0;
      teardown();
      start();
    }, delay);
  }

  function startNative() {
    video.src = STREAM;
    safePlay();
  }

  function startHlsJs() {
    const h = new Hls(HLS_CONFIG);
    hls = h;
    h.on(Hls.Events.MANIFEST_PARSED, () => safePlay());
    h.on(Hls.Events.FRAG_LOADED, () => { netErrors = 0; });
    h.on(Hls.Events.ERROR, (_evt, data) => {
      if (!data.fatal || hls !== h) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
        // The server answers 503 until the channel is on air, and nothing at
        // all while the container restarts: keep retrying quietly.
        const manifest = data.details === Hls.ErrorDetails.MANIFEST_LOAD_ERROR ||
                         data.details === Hls.ErrorDetails.MANIFEST_LOAD_TIMEOUT ||
                         data.details === Hls.ErrorDetails.MANIFEST_PARSING_ERROR;
        if (manifest || ++netErrors > 3) { rebuild(manifest ? 2000 : 3000); return; }
        setTimeout(() => { if (hls === h) h.startLoad(); }, 2000);
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
        const now = Date.now();
        if (now - lastMediaError < 5000) { rebuild(3000); return; }
        lastMediaError = now;
        h.recoverMediaError();
      } else {
        rebuild(3000);
      }
    });
    h.loadSource(STREAM);
    h.attachMedia(video);
  }

  function unsupported() {
    overlay.hidden = false;
    overlay.querySelector('span').textContent = "THIS BROWSER CAN'T PLAY HLS";
  }

  // ---- staying live ----------------------------------------------------------

  function behindBy() {
    if (hls) return (typeof hls.latency === 'number' && isFinite(hls.latency)) ? hls.latency : 0;
    const s = video.seekable;
    return (s && s.length) ? Math.max(0, s.end(s.length - 1) - video.currentTime) : 0;
  }

  // It's TV: after time away, you rejoin whatever is airing now.
  function goLive(awayMs) {
    if (awayMs > LONG_AWAY_MS) { rebuild(0); return; }
    if (behindBy() > LIVE_SLACK) {
      if (hls && typeof hls.liveSyncPosition === 'number' && isFinite(hls.liveSyncPosition)) {
        video.currentTime = hls.liveSyncPosition;
      } else {
        rebuild(0);
        return;
      }
    }
    safePlay();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    const away = hiddenAt ? Date.now() - hiddenAt : 0;
    hiddenAt = 0;
    pausedAt = 0;
    goLive(away);
  });

  window.addEventListener('pageshow', e => { if (e.persisted) rebuild(0); });

  // ---- video element events --------------------------------------------------

  video.addEventListener('playing', () => { overlay.hidden = true; lastProgress = Date.now(); setLive(true); });
  ['waiting', 'stalled', 'emptied'].forEach(ev => video.addEventListener(ev, () => setLive(false)));
  video.addEventListener('pause', () => {
    setLive(false);
    if (Date.now() > suppressPauseUntil && !document.hidden) pausedAt = Date.now();
  });
  video.addEventListener('play', () => {
    if (!pausedAt) return;
    const away = Date.now() - pausedAt;
    pausedAt = 0;
    goLive(away);
  });
  video.addEventListener('volumechange', () => render());
  video.addEventListener('error', () => { if (!hls) rebuild(3000); });

  // Watchdog: supposed to be playing but the picture hasn't moved → start over.
  // Covers native stalls and a stream that changed underneath us (restart).
  setInterval(() => {
    const now = Date.now();
    if (video.paused || document.hidden || rebuildTimer) { lastProgress = now; return; }
    if (video.currentTime !== lastTime) { lastTime = video.currentTime; lastProgress = now; return; }
    if (now - lastProgress > STALL_MS) { lastProgress = now; rebuild(0); }
  }, 1000);

  // ---- controls ---------------------------------------------------------------

  function toggleMute() {
    video.muted = !video.muted;
    overlay.hidden = true;
    render();
    if (!video.muted || video.paused) safePlay();
  }

  function toggleFullscreen() {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      return;
    }
    if (stage.requestFullscreen) {
      const r = stage.requestFullscreen();
      if (r && typeof r.catch === 'function') r.catch(() => {});
    } else if (stage.webkitRequestFullscreen) {
      stage.webkitRequestFullscreen();
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();       // iPhone: only the video element can go fullscreen
    }
  }

  muteBtn.addEventListener('click', toggleMute);

  // Volume: 0-20 steps like an old set, shown as a green bar that fades out.
  const STEPS = 20;
  const osdVol = document.getElementById('osd-vol');
  const bars = osdVol.querySelector('.bars');
  for (let i = 0; i < STEPS; i++) bars.appendChild(document.createElement('i'));
  let level = STEPS;
  try { const v = parseInt(localStorage.getItem('deckTvVolume'), 10); if (v >= 0 && v <= STEPS) level = v; } catch (_) {}
  video.volume = level / STEPS;
  let volTimer = 0;

  function changeVolume(delta) {
    level = Math.max(0, Math.min(STEPS, level + delta));
    video.volume = level / STEPS;
    if (video.muted && delta > 0) { video.muted = false; overlay.hidden = true; safePlay(); }
    try { localStorage.setItem('deckTvVolume', String(level)); } catch (_) {}
    [...bars.children].forEach((b, i) => b.classList.toggle('on', i < level));
    osdVol.hidden = false;
    clearTimeout(volTimer);
    volTimer = setTimeout(() => { osdVol.hidden = true; }, 2500);
    render();
  }

  document.getElementById('vol-down').addEventListener('click', () => changeVolume(-1));
  document.getElementById('vol-up').addEventListener('click', () => changeVolume(1));

  // The screen: a tap shows the readout (like the remote's DISPLAY key) or
  // starts playback if the browser refused to; a double tap goes fullscreen.
  stage.addEventListener('click', () => {
    if (!overlay.hidden) { overlay.hidden = true; safePlay(); return; }
    if (tapTimer) {
      clearTimeout(tapTimer);
      tapTimer = 0;
      toggleFullscreen();
      return;
    }
    tapTimer = setTimeout(() => { tapTimer = 0; render(true); }, 280);
  });

  // ---- channel surf and bumps-only ---------------------------------------------
  // One broadcast for everyone, so these change the channel for every viewer:
  // a surf cuts to a random episode 10-50% of the way in (or, in bumps-only
  // mode, to a new bump), and BUMPS ONLY switches the channel to bumps back to
  // back. The server answers once the new programme is on air; static covers
  // the few seconds between.

  const surfBtn = document.getElementById('surf');
  const bumpsBtn = document.getElementById('bumps-only');
  const bumpsLed = document.getElementById('bumps-led');
  const noise = document.getElementById('static');
  const noiseCtx = noise.getContext('2d');
  let staticOn = false;

  function drawStatic() {
    if (!staticOn) return;
    const img = noiseCtx.createImageData(noise.width, noise.height);
    const px = img.data;
    for (let i = 0; i < px.length; i += 4) {
      px[i] = px[i + 1] = px[i + 2] = Math.random() * 255 | 0;
      px[i + 3] = 255;
    }
    noiseCtx.putImageData(img, 0, 0);
    requestAnimationFrame(drawStatic);
  }

  function setStatic(on) {
    staticOn = on;
    noise.hidden = !on;
    if (on) requestAnimationFrame(drawStatic);
  }

  function showMode(on) {
    bumpsLed.className = on ? 'led purple' : 'led';
    bumpsBtn.setAttribute('aria-pressed', String(on));
  }

  // Someone else may have flipped it: check whenever we (re)tune.
  function checkMode() {
    fetch('api/mode').then(r => r.json()).then(m => showMode(m.bumps_only)).catch(() => {});
  }

  async function changeChannel(url, body) {
    if (surfBtn.disabled) return;
    surfBtn.disabled = bumpsBtn.disabled = true;
    clearTimeout(rebuildTimer);
    rebuildTimer = 0;
    setStatic(true);
    teardown();                       // the old channel goes to static right away
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      setStatic(false);
      surfBtn.disabled = bumpsBtn.disabled = false;
    };
    setTimeout(finish, 20000);        // never leave the static up for good
    try { await fetch(url, { method: 'POST', body }); } catch (_) { /* tune in anyway */ }
    checkMode();
    video.addEventListener('playing', finish, { once: true });
    start();
  }

  const surf = () => changeChannel('api/surf');
  const toggleBumps = () => {
    if (bumpsBtn.disabled) return;
    const on = bumpsBtn.getAttribute('aria-pressed') !== 'true';
    showMode(on);
    changeChannel('api/bumps-only', JSON.stringify({ on }));
  };

  surfBtn.addEventListener('click', surf);
  bumpsBtn.addEventListener('click', toggleBumps);
  video.addEventListener('playing', checkMode);

  document.addEventListener('keydown', e => {
    switch (e.key.toLowerCase()) {
      case 'm': toggleMute(); break;
      case 'f': toggleFullscreen(); break;
      case 's': surf(); break;
      case 'b': toggleBumps(); break;
      case 'arrowup': case '+': case '=': e.preventDefault(); changeVolume(1); break;
      case 'arrowdown': case '-': e.preventDefault(); changeVolume(-1); break;
    }
  });

  render(true);
  start();
})();
</script>
</body>
</html>
